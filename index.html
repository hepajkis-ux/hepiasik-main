<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hepiasik.com — Hiburan Ringan & Bacaan Cepat</title>
  <meta name="description" content="Hepiasik.com menyajikan hiburan ringan dan bacaan cepat yang ditulis secara orisinal.">
  <link rel="canonical" href="https://hepiasik.com/">
  <meta name="robots" content="index,follow">

  <style>
    :root{
      --bg:#ffffff;
      --surface:#f6f7f9;
      --text:#1f2937;
      --muted:#6b7280;
      --accent:#2563eb;
      --line:#e5e7eb;
      --radius:16px;
      --max:1100px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.65;
    }
    img{max-width:100%;display:block;border-radius:var(--radius)}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:var(--max);margin:auto;padding:0 20px}

    header{
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      background:#fff;
      z-index:10;
    }
    .nav{
      height:64px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{font-weight:900;font-size:22px}

    section{padding:48px 0}
    h2{margin:0 0 24px;font-size:28px}

    .cards{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:24px;
    }
    @media(max-width:900px){
      .cards{grid-template-columns:1fr}
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:20px;
      background:#fff;
      transition:.2s;
    }
    .card:hover{transform:translateY(-4px)}

    .card img{
      height:180px;
      object-fit:cover;
      margin-bottom:14px;
    }

    .meta{
      font-size:12px;
      font-weight:700;
      color:var(--accent);
      margin-bottom:6px;
      text-transform:uppercase;
    }

    .filter{
      display:flex;
      gap:10px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }
    .filter button{
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight:600;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/">Hepiasik.com</a>
  </div>
</header>

<main class="wrap">

<section>
  <h2>Artikel Terbaru</h2>

  <div class="filter">
    <button onclick="filter('all')">Semua</button>
    <button onclick="filter('hiburan')">Hiburan</button>
    <button onclick="filter('viral')">Viral</button>
  </div>

  <div class="cards" id="articleList"></div>
</section>

</main>

<script>
const articles = [
  {
    title:"Kenapa Konten Hiburan Ringan Justru Paling Dicari",
    url:"/kenapa-konten-hiburan-ringan-paling-dicari.html",
    thumb:"/assets/thumbnails/hiburan-ringan.jpg",
    category:"hiburan",
    read:"7 menit baca",
    desc:"Analisis mendalam kenapa konten hiburan ringan menjadi stress relief utama di era digital."
  }
];

const list = document.getElementById("articleList");

articles.forEach(a=>{
  list.innerHTML += `
    <article class="card" data-category="${a.category}">
      <img src="${a.thumb}" alt="${a.title}">
      <div class="meta">${a.category} • ${a.read}</div>
      <h3><a href="${a.url}">${a.title}</a></h3>
      <p>${a.desc}</p>
    </article>
  `;
});

function filter(cat){
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display =
      cat==="all" || c.dataset.category===cat
      ? "block"
      : "none";
  });
}
</script>

</body>
</html>
